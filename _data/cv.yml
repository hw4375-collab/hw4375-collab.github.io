    Selected Projects:
      - label: Monoidal Category Formalization — Lean 4 (2026)
        details: Formalizations involving monoidal categories, categorical constructions, and strictification-related structures using dependent types and Mathlib.
      - label: Semantic Boundary — LLM Reasoning Verification and Faithfulness (2026)
        details: Controlled benchmarks comparing direct LLM reasoning, self-checking, and Lean-assisted verification, with attention to reasoning errors and semantic mistranslation.
      - label: FalconVerifier — AI Reasoning Verification (2026)
        details: Public verification prototype that separates model-generated interpretation from deterministic formal verification and records machine-checkable assurance artifacts.
      - label: Arabic Pregroup Grammar — Lean 4 (2026)
        details: Typed Arabic grammatical representations with pregroup-style types and machine-checkable reductions; initial VSO/SVO examples are formalized as sentence-level proof certificates.
